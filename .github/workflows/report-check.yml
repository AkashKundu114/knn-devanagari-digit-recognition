name: Report Source Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify LaTeX sources and Markdown links
        run: |
          python -c "
          from pathlib import Path
          import re

          required = [
              Path('report/latex/main.tex'),
              Path('report/latex/generated_results.tex'),
              Path('report/latex/figures/confusion_matrix.png'),
              Path('report/latex/figures/dataset_samples.png'),
              Path('report/latex/figures/k_validation_curve.png'),
              Path('report/assignment_report.md'),
          ]
          missing = [str(p) for p in required if not p.is_file()]
          assert not missing, f'Missing report files: {missing}'

          link_re = re.compile(r'!?\[[^\]]*\]\(([^)]+)\)')
          for md_path in sorted(list(Path('.').glob('*.md')) + list(Path('report').glob('*.md'))):
              text = md_path.read_text(encoding='utf-8')
              for target in link_re.findall(text):
                  if target.startswith(('http://', 'https://', '#')):
                      continue
                  target_clean = target.split('#')[0]
                  resolved = (md_path.parent / target_clean).resolve()
                  # results/ files are git-ignored and generated locally on dataset run
                  if 'results/' in target_clean.replace('\\\\', '/'):
                      continue
                  assert resolved.exists(), f'Broken link in {md_path}: {target}'
          print('LaTeX source and Markdown link validation passed.')
          "

      - name: Compile LaTeX report if pdflatex is installed
        run: |
          if command -v pdflatex >/dev/null 2>&1; then
            cd report/latex
            pdflatex -interaction=nonstopmode -halt-on-error main.tex
            pdflatex -interaction=nonstopmode -halt-on-error main.tex
          else
            echo "pdflatex not installed on runner; skipping optional PDF compile."
          fi
