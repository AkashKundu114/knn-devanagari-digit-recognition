name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall src tests

      - name: Run unit tests
        run: python -m pytest -v

      - name: Run synthetic end-to-end smoke test
        run: |
          python -c "
          from pathlib import Path
          import tempfile
          import numpy as np
          import pandas as pd
          from src.train_evaluate import run_experiment
          from src.generate_report import write_latex_results

          with tempfile.TemporaryDirectory() as tmp:
              tmp_path = Path(tmp)
              csv_dir = tmp_path / 'data' / 'DEVA-C-SET-CSV' / 'DIGITS' / 'CSV_FILES'
              csv_dir.mkdir(parents=True)
              for d in range(10):
                  rows = []
                  for v in range(12):
                      arr = np.full((65, 65), 255, dtype=np.uint8)
                      r0 = 10 + (d % 5) * 9 + (v % 4)
                      c0 = 10 + (d // 5) * 22 + ((v // 4) % 4)
                      arr[r0:r0+8, c0:c0+12] = 0
                      rows.append(arr.reshape(-1))
                  pd.DataFrame(rows).to_csv(csv_dir / f'{d}.csv', header=False, index=False)

              out_dir = tmp_path / 'results'
              metrics = run_experiment(
                  data_dir=tmp_path / 'data',
                  output_dir=out_dir,
                  image_sizes=[16],
                  preprocess_modes=['centered'],
                  k_values=[1, 3],
                  weights_list=['distance', 'uniform'],
                  random_state=42,
              )
              assert metrics['total_images_loaded'] == 120
              assert (out_dir / 'metrics.json').is_file()
              tex_out = write_latex_results(results_dir=out_dir, latex_dir=tmp_path / 'latex')
              assert tex_out.is_file()
              print('Synthetic smoke test passed:', metrics['test_accuracy'])
          "
